# ============================================================
# LOCATION BLOCK SÉCURISÉ POUR NEXT.JS - REACT2SHELL PROTECTION
# À ajouter dans le bloc server de maisondugeek.fr
# ============================================================

# Protection React2Shell pour le proxy Next.js
location / {
    # === PROTECTION REACT2SHELL ===
    
    # 1. Bloquer les headers Next-Action trop longs (bypass WAF)
    if ($http_next_action ~* "^.{1000,}$") {
        return 403 "Blocked: Suspicious Next-Action header";
    }
    
    # 2. Bloquer les requêtes avec patterns React2Shell suspects
    # Patterns: multipart avec ":" et "$" (serialization markers)
    set $block_request 0;
    
    # 3. Rate limiting
    limit_req zone=react2shell_limit burst=50 nodelay;
    
    # 4. Limiter la taille du body pour les requêtes POST
    client_max_body_size 5M;
    
    # === PROXY CONFIGURATION ===
    
    # Redirection racine vers /fr
    location = / {
        return 301 /fr;
    }
    
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts stricts pour éviter les DoS
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Buffer settings optimisés
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # === HEADERS DE SÉCURITÉ ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Protection spécifique pour les Server Actions (route /_next/...)
location /_next/ {
    # Bloquer les requêtes POST suspectes vers _next/
    if ($request_method = POST) {
        # Vérifier les headers suspects
        set $suspicious 0;
        if ($http_next_action ~* "^.{500,}$") {
            set $suspicious 1;
        }
        if ($content_length > 1048576) {
            set $suspicious "${suspicious}1";
        }
    }
    
    # Rate limiting plus strict pour _next/
    limit_req zone=api_limit burst=20 nodelay;
    
    # Fichiers statiques
    alias /var/www/maisondugeek-v2/.next/;
    expires 365d;
    add_header Cache-Control "public, immutable";
}
