<!DOCTYPE html>
<html>
<head>
    <title>Debug Search JS</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
        input { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🐞 Debug JavaScript Recherche</h1>
    
    <div class="test">
        <h3>Test 1: Éléments HTML</h3>
        <input id="kbSearch" placeholder="Test search" value="">
        <button id="searchButton">Rechercher</button>
        
        <!-- Toggles de test -->
        <div>
            <input type="radio" name="search_type_ui" id="search_auto_ui" value="auto">
            <label for="search_auto_ui">Auto</label>
            
            <input type="radio" name="search_type_ui" id="search_standard_ui" value="standard">
            <label for="search_standard_ui">Standard</label>
            
            <input type="radio" name="search_type_ui" id="search_intelligent_ui" value="intelligent">
            <label for="search_intelligent_ui">IA</label>
        </div>
        
        <select id="kbCategoryFilter">
            <option value="0">Toutes</option>
        </select>
    </div>
    
    <div id="results"></div>
    
    <script>
        console.log("🐞 Script de debug démarré");
        
        // Fonction de log
        function logResult(test, success, message) {
            const div = document.createElement("div");
            div.className = "test " + (success ? "success" : "error");
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            document.getElementById("results").appendChild(div);
            console.log(`${test}: ${message}`);
        }
        
        document.addEventListener("DOMContentLoaded", function() {
            console.log("🐞 DOM Content Loaded");
            
            // Test 1: Vérifier les éléments
            const searchInput = document.getElementById("kbSearch");
            const searchButton = document.getElementById("searchButton");
            const categoryFilter = document.getElementById("kbCategoryFilter");
            
            logResult("Élément searchInput", !!searchInput, searchInput ? "Trouvé" : "MANQUANT");
            logResult("Élément searchButton", !!searchButton, searchButton ? "Trouvé" : "MANQUANT");
            logResult("Élément categoryFilter", !!categoryFilter, categoryFilter ? "Trouvé" : "MANQUANT");
            
            // Test 2: Vérifier les radios
            const radios = document.querySelectorAll("input[name='search_type_ui']");
            logResult("Radios search_type_ui", radios.length > 0, `${radios.length} trouvés`);
            
            // Test 3: Fonctions de base
            function isSearchTypeSelected() {
                const searchTypeRadio = document.querySelector("input[name='search_type_ui']:checked");
                return searchTypeRadio !== null;
            }
            
            function testSearch() {
                const searchTerm = searchInput ? searchInput.value.trim() : "";
                const isSelected = isSearchTypeSelected();
                
                logResult("Test de recherche", true, `Terme: "${searchTerm}", Type sélectionné: ${isSelected}`);
                
                if (!searchTerm) {
                    logResult("Validation", false, "Aucun terme de recherche");
                    return;
                }
                
                if (!isSelected) {
                    logResult("Modal requis", true, "Aucun type sélectionné - Modal devrait s'ouvrir");
                } else {
                    const selectedType = document.querySelector("input[name='search_type_ui']:checked").value;
                    logResult("Recherche directe", true, `Type: ${selectedType}`);
                }
            }
            
            // Test 4: Event listeners
            if (searchButton) {
                searchButton.addEventListener("click", function() {
                    logResult("Event Click Button", true, "Bouton cliqué");
                    testSearch();
                });
            }
            
            if (searchInput) {
                searchInput.addEventListener("keypress", function(e) {
                    if (e.key === "Enter") {
                        logResult("Event Entrée", true, "Touche Entrée détectée");
                        testSearch();
                    }
                });
            }
            
            // Test 5: Radios
            radios.forEach(function(radio, index) {
                radio.addEventListener("change", function() {
                    logResult(`Radio ${index}`, true, `Sélectionné: ${this.value}`);
                });
            });
            
            logResult("Initialisation", true, "Tous les event listeners ajoutés");
            
            // Test automatique après 2 secondes
            setTimeout(function() {
                if (searchInput) {
                    searchInput.value = "test activation";
                    logResult("Test Auto", true, "Valeur ajoutée automatiquement");
                }
            }, 2000);
        });
    </script>
</body>
</html>
