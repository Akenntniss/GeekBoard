name: Build Windows Application

on:
  push:
    branches: [ main, master ]
    paths:
      - 'desktop_app/**'
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'
        
    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop
      
    - name: Get dependencies
      working-directory: desktop_app
      run: flutter pub get
      
    - name: Build Windows Release
      working-directory: desktop_app
      run: flutter build windows --release
      
    - name: Download Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
        Start-Process -FilePath "innosetup.exe" -Args "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait
        
    - name: Create Installer
      working-directory: desktop_app
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows_installer.iss"
        
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: SERVO-Windows-Installer
        path: desktop_app/Output/SERVO_Setup.exe
        retention-days: 30
        
    - name: Upload Windows Build (ZIP)
      uses: actions/upload-artifact@v4
      with:
        name: SERVO-Windows-Portable
        path: desktop_app/build/windows/x64/runner/Release/
        retention-days: 30
