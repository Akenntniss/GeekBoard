# ============================================================
# PROTECTION REACT2SHELL (CVE-2025-55182) - NGINX CONFIG
# À inclure dans vos blocs server Next.js
# ============================================================

# 1. BLOCAGE DES HEADERS NEXT-ACTION MALVEILLANTS
# L'exploit utilise le header Next-Action pour déclencher la vulnérabilité
map $http_next_action $block_next_action {
    default 0;
    # Bloquer les valeurs suspectes ou trop longues
    "~^.{1000,}$" 1;
}

# 2. LIMITER LA TAILLE DES REQUÊTES 
# Les payloads React2Shell sont souvent > 8KB pour bypasser les WAF
client_max_body_size 10M;
client_body_buffer_size 8k;

# 3. HEADERS DE SÉCURITÉ RENFORCÉS
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

# 4. PROTECTION CONTRE LES PAYLOADS MULTIPART MALVEILLANTS
# React2Shell utilise multipart/form-data avec des patterns spécifiques
# Bloquer les requêtes avec des patterns suspects dans le Content-Type
map $content_type $suspicious_content_type {
    default 0;
    "~*multipart.*:.*\$" 1;
}

# 5. RATE LIMITING POUR PRÉVENIR LES ATTAQUES
limit_req_zone $binary_remote_addr zone=react2shell_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 6. LOG DES TENTATIVES SUSPECTES
log_format react2shell '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'next_action="$http_next_action" '
                       'rsc_action="$http_rsc_action_id"';
