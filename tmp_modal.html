
<!-- Modal Infos Rapides Réparation -->
<div class="modal fade" id="repairQuickInfoModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg night-mode">
            <div class="modal-header bg-gradient border-0 night-mode">
                <h5 class="modal-title fw-bold night-mode"><i class="fas fa-tools me-2"></i>Informations</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 night-mode">
                <div id="repairQuickInfoLoading" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-3 text-muted">Chargement...</p>
                </div>
                <div id="repairQuickInfoContent" style="display: none;">
                    <div class="mb-3"><h6 class="text-muted"><i class="far fa-user me-1"></i> Client</h6><p class="h5 night-mode" id="repairClientName">-</p></div>
                    <div class="mb-3"><h6 class="text-muted"><i class="fas fa-mobile-alt me-1"></i> Appareil</h6><p class="h6 night-mode" id="repairModel">-</p></div>
                    <div class="mb-3"><h6 class="text-muted"><i class="fas fa-exclamation-circle me-1"></i> Problème</h6><p class="night-mode" id="repairProblem">-</p></div>
                    <div class="mb-3"><h6 class="text-muted"><i class="fas fa-info-circle me-1"></i> Statut</h6><span id="repairStatus" class="badge bg-primary">-</span></div>
                    <div class="mb-3"><h6 class="text-muted"><i class="fas fa-sticky-note me-1"></i> Note Interne</h6><div class="p-3 bg-light night-mode rounded"><p class="mb-0 small night-mode" id="repairNote">Aucune note</p></div></div>
                    <div class="mb-3"><h6 class="text-muted"><i class="fas fa-camera me-1"></i> Photo</h6><div id="repairPhotoContainer"><img id="repairPhoto" class="img-fluid rounded" style="max-height: 300px; display: none;"><p id="repairNoPhoto" class="text-muted">Aucune photo</p></div></div>
                </div>
                <div id="repairQuickInfoError" class="alert alert-danger" style="display: none;"><i class="fas fa-exclamation-triangle me-2"></i><span id="repairQuickInfoErrorMessage">Erreur</span></div>
            </div>
            <div class="modal-footer border-0 night-mode">
                <button type="button" class="btn btn-secondary night-mode" data-bs-dismiss="modal">Fermer</button>
                <a id="repairDetailsLink" href="#" target="_blank" class="btn btn-primary night-mode"><i class="fas fa-external-link-alt me-1"></i> Détails</a>
            </div>
        </div>
    </div>
</div>
