name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        working-directory: desktop_app
        run: flutter pub get
      
      - name: Build Windows release
        working-directory: desktop_app
        run: flutter build windows --release
      
      - name: Create portable package
        run: |
          mkdir -p release
          cp -r desktop_app/build/windows/x64/runner/Release/* release/
          Compress-Archive -Path release/* -DestinationPath GeekBoard_Windows_v1.0.zip
        shell: pwsh
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeekBoard-Windows-v1.0
          path: GeekBoard_Windows_v1.0.zip
          retention-days: 30
      
      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: GeekBoard_Windows_v1.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
